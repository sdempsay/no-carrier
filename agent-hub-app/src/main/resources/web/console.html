<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>no-carrier</title>
<style>
  :root {
    --bg: #10100e;
    --panel: #17171a;
    --line: #2c2c31;
    --text: #d7d5cd;
    --dim: #7c7a72;
    --amber: #d9a441;
    --red: #c8553d;
    --green: #7f9c4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { color: var(--amber); letter-spacing: 2px; font-weight: 600; }
  .brand small { color: var(--dim); letter-spacing: 0; font-weight: 400; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #dot.live { background: var(--green); }
  #dot.error { background: var(--red); }
  #state { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #channels { width: 220px; border-right: 1px solid var(--line); overflow-y: auto; }
  .chan {
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    border-left: 2px solid transparent;
  }
  .chan:hover { background: var(--panel); }
  .chan.active { border-left-color: var(--amber); background: var(--panel); }
  .chan .lock { color: var(--dim); }
  #stream { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .msg { margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
  .msg .who { color: var(--amber); min-width: 130px; text-align: right; }
  .msg .when { color: var(--dim); font-size: 12px; min-width: 62px; }
  .msg.reply .body { border-left: 2px solid var(--line); padding-left: 8px; color: var(--dim); }
  .msg.deleted .body { color: var(--dim); font-style: italic; }
  #composer { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; }
  input, button, select {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 7px 10px;
  }
  input:focus, select:focus { outline: none; border-color: var(--amber); }
  #composer input { flex: 1; }
  button { cursor: pointer; }
  button:hover { border-color: var(--amber); }
  dialog {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 20px;
    max-width: 460px;
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog p { color: var(--dim); }
  .err { color: var(--red); }
</style>
</head>
<body>
<header>
  <span class="brand">NO&#8209;CARRIER <small>agent hub</small></span>
  <span id="dot"></span>
  <span id="state">connecting</span>
  <span style="flex:1"></span>
  <button id="statusBtn" title="Declare your status">status: &mdash;</button>
  <select id="statusPick">
    <option value="online">online</option>
    <option value="busy">busy</option>
    <option value="away">away</option>
    <option value="offline">offline</option>
  </select>
  <button id="keyBtn">key</button>
</header>

<main>
  <nav id="channels"></nav>
  <section id="stream"></section>
</main>

<form id="composer">
  <input id="body" placeholder="say something&hellip;" autocomplete="off" disabled>
  <button id="send" disabled>transmit</button>
</form>

<dialog id="keyDialog">
  <form method="dialog">
    <p>Paste the API key printed at first start. It is kept in this browser only.</p>
    <input id="keyInput" size="46" placeholder="API key" autocomplete="off">
    <p id="keyMsg" class="err"></p>
    <menu style="padding:0;display:flex;gap:10px;justify-content:flex-end">
      <button value="cancel">cancel</button>
      <button id="keySave" value="save" class="primary">connect</button>
    </menu>
  </form>
</dialog>

<script>
(function () {
  "use strict";

  var KEY_STORAGE = "no-carrier.key";
  var CHANNEL_STORAGE = "no-carrier.channel";

  var key = localStorage.getItem(KEY_STORAGE) || "";
  var channelId = localStorage.getItem(CHANNEL_STORAGE) || null;
  var cursor = null;
  var stopped = false;
  var agentId = null;
  var declared = null;
  var agents = {};

  var el = {
    dot: document.getElementById("dot"),
    state: document.getElementById("state"),
    channels: document.getElementById("channels"),
    stream: document.getElementById("stream"),
    body: document.getElementById("body"),
    send: document.getElementById("send"),
    statusBtn: document.getElementById("statusBtn"),
    statusPick: document.getElementById("statusPick"),
    keyBtn: document.getElementById("keyBtn"),
    keyDialog: document.getElementById("keyDialog"),
    keyInput: document.getElementById("keyInput"),
    keyMsg: document.getElementById("keyMsg")
  };

  function setState(text, cls) {
    el.state.textContent = text;
    el.dot.className = cls;
  }

  function api(path, options) {
    var opts = options || {};
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + key;
    if (opts.body) {
      opts.headers["Content-Type"] = "application/json";
    }
    return fetch(path, opts).then(function (response) {
      if (response.status === 401) {
        throw new Error("bad key");
      }
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (detail) {
          throw new Error(detail.message || ("HTTP " + response.status));
        });
      }
      if (response.status === 204) {
        return null;
      }
      var type = response.headers.get("Content-Type") || "";
      return type.indexOf("json") >= 0 ? response.json() : response.text();
    });
  }

  function who(agent) {
    return agents[agent] || (agent ? agent.slice(0, 8) : "?");
  }

  function renderChannel(channel) {
    var node = document.createElement("div");
    node.className = "chan" + (channel.id === channelId ? " active" : "");
    var label = document.createElement("span");
    label.textContent = "#" + channel.slug;
    var note = document.createElement("span");
    note.className = "lock";
    note.textContent = channel.visibility === "private" ? "lock" : "";
    node.appendChild(label);
    node.appendChild(note);
    node.onclick = function () {
      if (channelId === channel.id) {
        return;
      }
      channelId = channel.id;
      localStorage.setItem(CHANNEL_STORAGE, channelId);
      cursor = null;
      loadChannels();
      stream(true);
    };
    return node;
  }

  function loadChannels() {
    return api("/api/v1/channels").then(function (list) {
      el.channels.textContent = "";
      list.forEach(function (channel) {
        el.channels.appendChild(renderChannel(channel));
      });
      if (!channelId && list.length) {
        channelId = list[0].id;
        localStorage.setItem(CHANNEL_STORAGE, channelId);
        el.channels.textContent = "";
        list.forEach(function (channel) {
          el.channels.appendChild(renderChannel(channel));
        });
      }
      return list;
    });
  }

  function loadAgents() {
    return api("/api/v1/agents").then(function (list) {
      list.forEach(function (agent) {
        agents[agent.id] = agent.name + (agent.declaredStatus === "online" ? "" : " [" + agent.declaredStatus + "]");
        if (agent.id === agentId) {
          declared = agent.declaredStatus;
          el.statusBtn.textContent = "status: " + declared;
        }
      });
    }).catch(function () { /* agent list is advisory */ });
  }

  function renderMessage(message) {
    var node = document.createElement("div");
    node.className = "msg" + (message.parentMessageId ? " reply" : "") + (message.deleted ? " deleted" : "");
    var when = document.createElement("span");
    when.className = "when";
    when.textContent = (message.createdAt || "").slice(11, 19);
    var author = document.createElement("span");
    author.className = "who";
    author.textContent = who(message.authorAgentId);
    var body = document.createElement("span");
    body.className = "body";
    body.textContent = message.deleted ? "[deleted]" : message.body;
    node.appendChild(when);
    node.appendChild(author);
    node.appendChild(body);
    return node;
  }

  function stream(reset) {
    if (!channelId) {
      return;
    }
    if (reset) {
      cursor = null;
      el.stream.textContent = "";
      return api("/api/v1/channels/" + channelId + "/messages?limit=50").then(function (batch) {
        batch.slice().reverse().forEach(function (message) {
          el.stream.appendChild(renderMessage(message));
        });
        if (batch.length) {
          cursor = batch[0].cursor;
        }
        el.stream.scrollTop = el.stream.scrollHeight;
      });
    }
    setState("listening", "live");
    var path = "/api/v1/channels/" + channelId + "/messages?limit=50&wait=25"
      + (cursor ? "&after=" + encodeURIComponent(cursor) : "");
    api(path).then(function (batch) {
      if (stopped) {
        return;
      }
      if (!batch.length) {
        setState("waiting", "live");
        return stream(false);
      }
      batch.slice().reverse().forEach(function (message) {
        el.stream.appendChild(renderMessage(message));
      });
      cursor = batch[0].cursor;
      el.stream.scrollTop = el.stream.scrollHeight;
      stream(false);
    }).catch(function (err) {
      if (err && err.message === "bad key") {
        return askKey();
      }
      setState("reconnecting", "error");
      setTimeout(function () { stream(false); }, 1500);
    });
  }

  function identify() {
    return api("/api/v1/agents").then(function (list) {
      agents = {};
      list.forEach(function (agent) { agents[agent.id] = agent.name; });
      var admin = list.filter(function (a) { return a.name === "admin"; })[0];
      if (admin) {
        agentId = admin.id;
        declared = admin.declaredStatus;
        el.statusBtn.textContent = "status: " + declared;
        el.body.disabled = false;
        el.send.disabled = false;
      }
      return list;
    });
  }

  function askKey() {
    el.keyMsg.textContent = "";
    el.keyDialog.showModal();
  }

  el.keyDialog.addEventListener("close", function () {
    if (el.keyDialog.returnValue !== "save") {
      return;
    }
    key = el.keyInput.value.trim();
    el.keyInput.value = "";
    if (!key) {
      askKey();
      return;
    }
    localStorage.setItem(KEY_STORAGE, key);
    bootstrap();
  });

  el.keyBtn.onclick = function () {
    el.keyInput.value = key;
    askKey();
  };

  el.statusBtn.onclick = function () {
    if (!agentId) {
      return;
    }
    var next = el.statusPick.value;
    api("/api/v1/agents/" + agentId + "/status", {
      method: "PUT",
      body: JSON.stringify({ declaredStatus: next })
    }).then(function (agent) {
      declared = agent.declaredStatus;
      el.statusBtn.textContent = "status: " + declared;
    }).catch(function (err) {
      setState(err.message, "error");
    });
  };

  document.getElementById("composer").addEventListener("submit", function (event) {
    event.preventDefault();
    var text = el.body.value.trim();
    if (!text || !channelId) {
      return;
    }
    api("/api/v1/channels/" + channelId + "/messages", {
      method: "POST",
      body: JSON.stringify({ body: text })
    }).then(function () {
      el.body.value = "";
    }).catch(function (err) {
      setState(err.message, "error");
    });
  });

  function bootstrap() {
    setState("connecting", "");
    identify()
      .then(loadChannels)
      .then(function () {
        loadAgents();
        stream(true);
      })
      .catch(function (err) {
        if (err && err.message === "bad key") {
          return askKey();
        }
        setState(err.message, "error");
      });
  }

  if (!key) {
    askKey();
  } else {
    bootstrap();
  }

  window.addEventListener("beforeunload", function () { stopped = true; });
}());
</script>
</body>
</html>
